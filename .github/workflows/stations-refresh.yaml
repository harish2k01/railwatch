name: Refresh station list

# Monthly: rebuild the station list from the current NTES timetable crawled by railpull
# (github.com/shwetankg07/railpull, MIT), the only source. Stations with a long-distance or Passenger stop are
# kept; everything else is dropped (scripts/stations-railpull.mjs). Opens a PR with what was added and dropped.
#
# A full polite crawl (~1.2 s per request, railpull's default; never lower it) takes about 8 hours, longer than
# GitHub-hosted runners get no answer from NTES, so it runs on the homelab runner (an Indian network); one
# run usually finishes. It still runs daily on the 1st-6th and resumes from the month's cache if cut short. The station list is
# rebuilt once the crawl reports DONE. Only derived station codes are committed, never the crawled timetable.
on:
  schedule:
    - cron: "30 3 1-6 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: stations-refresh
  cancel-in-progress: false

env:
  RAILPULL_REF: 1034beffa2183ed77e948267b0b4b207aa02785f

jobs:
  refresh:
    runs-on: railwatch-runner
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v6
      - name: Month
        id: month
        run: echo "key=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: shwetankg07/railpull
          ref: ${{ env.RAILPULL_REF }}
          path: railpull
      - name: Restore this month's crawl
        uses: actions/cache/restore@v4
        with:
          path: railpull/data/raw
          key: railpull-${{ steps.month.outputs.key }}-${{ github.run_id }}
          restore-keys: railpull-${{ steps.month.outputs.key }}-
      - name: Skip if this month is already applied
        id: state
        run: |
          if [ -f railpull/data/raw/.applied ]; then echo "Already applied this month."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v6
        if: steps.state.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Crawl NTES timetable (resumes; stops before the job limit)
        id: crawl
        if: steps.state.outputs.skip != 'true'
        working-directory: railpull
        run: |
          pip install -q -r requirements.txt
          set +e
          timeout 11h python ntes/crawl.py
          code=$?
          set -e
          phase=$(python -c "import json;print(json.load(open('data/raw/crawl-status.json')).get('phase',''))" 2>/dev/null || true)
          echo "Crawler exit $code, phase '$phase'"
          count=$(ls data/raw/schedules 2>/dev/null | wc -l)
          echo "Schedules on disk: $count"
          if [ "$phase" = "DONE" ] && [ "$count" -eq 0 ]; then
            # NTES gave nothing (usually it isn't answering requests from GitHub's servers). Don't record an
            # empty crawl as finished: reset it so the next run starts over, and fail so it shows up.
            rm -rf data/raw/*
            echo "::error::Crawl found 0 trains; NTES likely isn't responding to GitHub runners. Run it from another network (self-hosted runner)."
            exit 1
          fi
          if [ "$phase" = "DONE" ]; then echo "done=true" >> "$GITHUB_OUTPUT"; fi
      - name: Save crawl progress
        if: always() && steps.state.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: railpull/data/raw
          key: railpull-${{ steps.month.outputs.key }}-${{ github.run_id }}
      - uses: actions/setup-node@v6
        if: steps.crawl.outputs.done == 'true'
        with:
          node-version: 24
      - name: Build station list
        if: steps.crawl.outputs.done == 'true'
        env:
          STATIONS_SUMMARY: ${{ runner.temp }}/stations-summary.md
        run: |
          npm ci --ignore-scripts
          (cd railpull && python transform/export.py)
          node scripts/stations-railpull.mjs railpull/data/out
          npx vitest run src/lib/stations.test.ts
      - name: Open a PR if the list changed
        if: steps.crawl.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ runner.temp }}/stations-summary.md
        run: |
          if git diff --quiet -- src/data; then echo "No station changes."; else
          branch="stations/refresh-$(date -u +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/data
          git commit -m "Monthly station list refresh"
          git push -f origin "$branch"
          {
            echo "Automatic refresh from the current NTES timetable (railpull). Kept: stations with a long-distance or Passenger stop. Dropped: everything else, including stations in no timetable. Codes in \`removed.tsv\` never come back."
            echo
            cat "$SUMMARY"
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" --label minor --title "Monthly station list refresh ($(date -u +%B\ %Y))" --body-file "$RUNNER_TEMP/body.md" || echo "PR already open."
          fi
          touch railpull/data/raw/.applied
      - name: Mark this month applied
        if: steps.crawl.outputs.done == 'true'
        uses: actions/cache/save@v4
        with:
          path: railpull/data/raw
          key: railpull-${{ steps.month.outputs.key }}-${{ github.run_id }}-applied
