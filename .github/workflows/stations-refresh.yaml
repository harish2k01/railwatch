name: Refresh station list

# Monthly: pull current codes and names from Wikidata (P5696), re-apply the official zonal names and the
# confirmed removals (scripts/stations-official/removed.tsv) and the long-distance filter (long-distance.tsv /
# dropped.tsv), and open a PR with the counts if anything changed. New codes are kept as "unverified-new" for review.
on:
  schedule:
    - cron: "30 3 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Refresh from Wikidata
        run: node scripts/update-stations-wikidata.mjs
      - name: Apply official names, removals and the long-distance filter
        env:
          STATIONS_SUMMARY: ${{ runner.temp }}/stations-summary.md
        run: node scripts/build-stations-official.mjs build
      - name: Station tests
        run: npx vitest run src/lib/stations.test.ts
      - name: Open a PR if the list changed
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ runner.temp }}/stations-summary.md
        run: |
          if git diff --quiet -- src/data scripts/stations-official; then echo "No station changes."; exit 0; fi
          branch="stations/refresh-$(date -u +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/data scripts/stations-official
          git commit -m "Monthly station list refresh"
          git push -f origin "$branch"
          {
            echo "Automatic refresh from Wikidata (P5696) with official zonal names, confirmed removals (\`removed.tsv\`) and the long-distance filter applied. Local-only and metro stations in \`dropped.tsv\` stay out."
            echo
            cat "$SUMMARY"
            echo
            echo "Review new unverified codes in \`scripts/stations-official/long-distance.tsv\`: move local-only ones to \`dropped.tsv\` and retired ones to \`removed.tsv\`."
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" --label minor --title "Monthly station list refresh ($(date -u +%B\ %Y))" --body-file "$RUNNER_TEMP/body.md" || echo "PR already open."
