name: Release RailWatch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: railwatch-release-main
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  # The advisory check needs only the lockfile, so it runs on a GitHub-hosted runner in seconds.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: npm audit --package-lock-only --audit-level=high

  # The PR's checks already ran on this exact tree when the PR branch was up to date with
  # main (the merge commit's tree equals the PR head's) and passed: skip the repeat.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      skip_verify: ${{ steps.tree.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          skip=false
          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            pr_head=$(git rev-parse HEAD^2)
            if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$pr_head^{tree}")" ]; then
              ok=$(gh api "repos/$GITHUB_REPOSITORY/commits/$pr_head/check-runs?check_name=verify" --jq '[.check_runs[]|select(.conclusion=="success")]|length')
              [ "$ok" -gt 0 ] && skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Skip verify (PR already tested this tree): $skip" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: gate
    if: needs.gate.outputs.skip_verify != 'true'
    runs-on: railwatch-runner
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: railwatch_ci_test
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/railwatch_ci_test
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CRON_SECRET: local-ci-worker-secret
      APP_URL: http://127.0.0.1:3102
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
      - name: Configure and verify CI PostgreSQL
        env:
          CI_POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: node scripts/prepare-ci-database.mjs
      - run: npm run prisma:generate
      - run: npm run prisma:migrate:deploy
      - run: npm run test:release
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      # No separate production build: the publish job's container build compiles the app
      # and fails the release on any build error.

  # Release planning only calls the GitHub API, so it runs on a GitHub-hosted runner.
  plan:
    needs: [audit, gate, verify]
    if: ${{ !cancelled() && needs.audit.result == 'success' && needs.gate.result == 'success' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Release tags can point at earlier merges whose workflow files differ from main's.
      # GitHub refuses such refs from GITHUB_TOKEN, so tagging uses the RailWatch GitHub App
      # with workflow permission.
      - name: Create release token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: harish2k01
          repositories: railwatch
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: read
      - id: plan
        run: node scripts/release/plan.mjs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-plan
          path: release-plan.json
  publish:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    permissions:
      contents: write
      packages: write
    # The planner returns only the newest release: one image build per run.
    uses: ./.github/workflows/container.yaml
    with:
      tag: ${{ fromJSON(needs.plan.outputs.targets)[0].tag }}
      sha: ${{ fromJSON(needs.plan.outputs.targets)[0].sha }}
    secrets:
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
