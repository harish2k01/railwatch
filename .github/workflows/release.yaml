name: Release RailWatch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: railwatch-release-main
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: railwatch-runner
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: railwatch_ci_test
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/railwatch_ci_test
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CRON_SECRET: local-ci-worker-secret
      APP_URL: http://127.0.0.1:3102
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
      - name: Configure and verify CI PostgreSQL
        env:
          CI_POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: node scripts/prepare-ci-database.mjs
      - run: npm audit --audit-level=high
      - run: npm run prisma:generate
      - run: npm run prisma:migrate:deploy
      - run: npm run test:release
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      # No separate production build: the publish job's container build compiles the app
      # and fails the release on any build error.

  # Release planning only calls the GitHub API, so it runs on a GitHub-hosted runner.
  plan:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - id: plan
        run: node scripts/release/plan.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-plan
          path: release-plan.json
  publish:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    uses: ./.github/workflows/container.yaml
    with:
      tag: ${{ matrix.target.tag }}
      sha: ${{ matrix.target.sha }}
    secrets:
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
