name: Pull Request Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
jobs:
  release-label:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'railwatch-runner' }}
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const selected = context.payload.pull_request.labels.filter(label => ["major", "minor", "patch"].includes(label.name));
            if (selected.length !== 1) core.setFailed("Add exactly one release label: major, minor, or patch.");
  verify:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'railwatch-runner' }}
    container: node:24-bookworm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: railwatch_ci_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:local-ci-only@postgres:5432/railwatch_ci_test
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CRON_SECRET: local-ci-worker-secret
      APP_URL: http://127.0.0.1:3102
      RUN_DB_TESTS: "1"
      RUN_E2E: "1"
    steps:
      - name: Install workflow tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git gh jq unzip python3 build-essential docker.io
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run prisma:generate
      - run: npm run prisma:migrate:deploy
      - run: npm run test:release
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-verification
          path: |
            build/railwatch-qa
          retention-days: 7
      - uses: docker/setup-buildx-action@v4
      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: APP_VERSION=pr-${{ github.event.pull_request.number }}
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
