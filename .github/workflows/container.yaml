name: Publish released RailWatch
on:
  workflow_call:
    inputs:
      tag: { required: true, type: string }
      sha: { required: true, type: string }
    secrets:
      # GitHub App allowed to commit deployment values to homelab-ops.
      GH_APP_ID: { required: false }
      GH_APP_PRIVATE_KEY: { required: false }
permissions:
  contents: write
  packages: write
defaults:
  run:
    shell: bash
jobs:
  publish:
    runs-on: railwatch-runner
    outputs:
      digest: ${{ steps.promote.outputs.digest }}
      latest: ${{ steps.promote.outputs.latest }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ inputs.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install workflow tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl git gh jq unzip python3 build-essential
      - name: Verify immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for an already published commit image
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:sha-$RELEASE_SHA" --format '{{json .Manifest}}' > existing.json 2> inspect-error.txt; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "digest=$(jq -r .digest existing.json)" >> "$GITHUB_OUTPUT"
          elif grep -Eiq 'manifest unknown|not found|name unknown' inspect-error.txt; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            cat inspect-error.txt >&2
            exit 1
          fi
      - name: Build and push exact release commit
        id: build
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ inputs.tag }}
          tags: ${{ env.IMAGE }}:sha-${{ inputs.sha }}
          # Reuse unchanged layers (npm ci, Prisma generate) and refresh the cache that
          # pull-request builds read.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=RailWatch
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.revision=${{ inputs.sha }}
      - name: Promote semantic aliases and record immutable image
        id: promote
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          digest="${EXISTING_DIGEST:-$BUILD_DIGEST}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create -t "$IMAGE:$RELEASE_TAG" -t "$IMAGE:$VERSION" "$IMAGE@$digest"
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [ "$latest" = "$RELEASE_TAG" ]; then
            docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE@$digest"
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "latest=$([ "$latest" = "$RELEASE_TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          jq -n --arg tag "$RELEASE_TAG" --arg sha "$RELEASE_SHA" --arg image "$IMAGE" --arg digest "$digest" '{tag:$tag,sha:$sha,image:$image,digest:$digest,reference:($image+"@"+$digest)}' > image.json
          gh release upload "$RELEASE_TAG" image.json --clobber --repo "$GITHUB_REPOSITORY"
          echo "Published $IMAGE@$digest ($RELEASE_TAG)" >> "$GITHUB_STEP_SUMMARY"
  # Only the newest release is deployed; Argo CD syncs the committed digest and runs migrations first.
  update-homelab:
    needs: publish
    if: needs.publish.outputs.latest == 'true'
    uses: harish2k01/homelab-ops/.github/workflows/update-version.yaml@main
    with:
      app_name: railwatch
      image_tag: ${{ inputs.tag }}
      image_digest: ${{ needs.publish.outputs.digest }}
      runner: railwatch-runner
    secrets:
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
