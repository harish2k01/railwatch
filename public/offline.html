<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f17"><title>Offline · RailWatch</title>
<style>
body{margin:0;min-height:100dvh;background:#0b0f17;color:#eef0f4;font:16px/1.5 Manrope,system-ui,sans-serif;display:flex;flex-direction:column}
.banner{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;background:#2a2210;color:#fde68a;font-size:13px;font-weight:600}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
header a{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#eef0f4}
header span{font-size:15px;font-weight:700}
main{flex:1;display:flex;flex-direction:column;gap:14px;padding:0 16px 16px;max-width:520px;width:100%;margin:0 auto;box-sizing:border-box}
.card{padding:20px;border-radius:18px;background:#141a24;border:1px solid #232b38;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{color:#9aa3b2}.top .muted{font-size:13px;font-weight:600}
.pill{height:24px;padding:0 10px;border-radius:999px;background:#12301f;color:#4ade80;font-size:12px;font-weight:700;display:inline-flex;align-items:center}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em}
dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
dl div{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:12px;background:#11131a}
dt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9aa3b2}
dd{margin:0;font-size:17px;font-weight:800;overflow-wrap:anywhere}
.pdf{flex:1;min-height:360px;border-radius:18px;background:#f4f4f5;color:#3f3f46;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;border:0;padding:0;font:inherit;cursor:pointer}
.pdf iframe{width:100%;height:100%;min-height:360px;border:0;background:#fff}
.pdf b{font-size:14px}.pdf small{font-size:12px;color:#52525b}
.foot{font-size:12px;text-align:center}
.others{display:grid;gap:8px}.others button{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid #232b38;background:#141a24;color:#eef0f4;font:600 14px inherit;text-align:left}
.empty{flex:1;display:grid;place-content:center;gap:12px;padding:32px;text-align:center}
.empty h2{margin:0;font-size:24px}.empty p{margin:0;color:#bec8d6}
.empty a{justify-self:center;padding:12px 20px;border-radius:12px;background:#8b8cf6;color:#0e0f2e;text-decoration:none;font-weight:700}
</style></head>
<body>
<div class="banner" role="status"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 5.2-2.8M19 13a10 10 0 0 0-2.4-1.7M12 20h.01"/></svg><span id="offline-status">You’re offline</span></div>
<header><a href="/" aria-label="Back"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></a><span>Ticket</span><span style="width:44px"></span></header>
<main id="offline-ticket" hidden></main>
<div class="empty" id="offline-empty"><h2>You’re offline</h2><p>Reconnect to view your journeys and tickets. Turn on offline tickets in Settings to keep the next three days on this phone.</p><a href="/">Try again</a></div>
<script src="/offline-reader.js"></script>
</body></html>
